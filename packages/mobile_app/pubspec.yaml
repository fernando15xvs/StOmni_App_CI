name: mobile_app
description: "StOmni - gestión de inventario, ventas y operaciones."
publish_to: 'none'

version: 2.0.1+2

resolution: workspace

environment:
  sdk: ^3.10.8

dependencies:
  core_logic:
    workspace: ^
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  image_picker: ^1.1.0
  intl: 0.20.2
  csv: ^6.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.5
  printing: ^5.11.1
  flutter_launcher_icons: ^0.13.1
  image_cropper: ^10.0.0+1
  excel: ^4.0.6
  pdf: ^3.10.8
  file_picker: ^8.0.0+1
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  http: ^1.6.0
  lottie: ^3.3.0
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  yaml: ^3.1.3
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  sqflite_common_ffi: ^2.4.0+3
  onesignal_flutter: ^5.6.7
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  web: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/slf_logo.png
    - assets/lottie/hardware_loader.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imagenes/iconlogo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/imagenes/iconlogo.png"
