name: Prepare 2D-H DEV migration
on:
  push:
    branches: [feature/saas-multitenant-foundation]
    paths: [.github/workflows/dev_2dh_migration_name.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'fernando15xvs/StOmni_App_CI'
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: '2.109.1'
      - name: Generate migration in disposable workspace
        run: |
          supabase migration new --help
          supabase migration new security_2dh_active_employment_fiscal_void
          ls supabase/migrations
