name: StOmni SaaS Full Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/saas-multitenant-foundation
    paths:
      - .github/saas-ci-trigger

permissions:
  contents: read

concurrency:
  group: saas-full-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'
  SUPABASE_CLI_VERSION: '2.109.1'
  NODE_VERSION: '24'
  EXPECTED_BOOTSTRAP_CANONICAL_SHA256: 'c6421682c5a64ee026d864483315c32e6e814b595fa91dfde527699236ad31ed'

jobs:
  t00-t02-static:
    name: T00-T02 static gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify CI candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/saas/CI_CANDIDATE_SOURCE.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'docs/saas/CI_CANDIDATE_SOURCE.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8').replace(/^\uFEFF/, ''));
          if (m.source_repository !== 'fernando15xvs/StOmni_App') throw new Error('source_repository inválido');
          if (m.source_branch !== 'feature/saas-multitenant-foundation') throw new Error('source_branch inválido');
          if (!/^[0-9a-f]{40}$/.test(m.source_sha ?? '')) throw new Error('source_sha inválido');
          if (m.bootstrap_path !== 'supabase/migrations/20260822052116_bootstrap_public_schema.sql') throw new Error('baseline no registrada');
          if (m.bootstrap_identity_kind !== 'canonical-git-lf') throw new Error('tipo de identidad de baseline inválido');
          if (m.bootstrap_sha256_checkout !== process.env.EXPECTED_BOOTSTRAP_CANONICAL_SHA256) throw new Error('hash canónico de baseline en manifiesto no coincide');
          console.log(`Source candidate: ${m.source_repository}@${m.source_sha}`);
          console.log(`Source branch: ${m.source_branch}`);
          console.log(`Canonical Git baseline SHA-256: ${m.bootstrap_sha256_checkout}`);
          NODE
          test -f supabase/migrations/20260822052116_bootstrap_public_schema.sql
          actual_sha="$(sha256sum supabase/migrations/20260822052116_bootstrap_public_schema.sql | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_BOOTSTRAP_CANONICAL_SHA256"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: T00 toolchain and candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git rev-parse --abbrev-ref HEAD
          git rev-parse HEAD
          node --version
          flutter --version
          dart --version
          deno --version
          supabase --version
          docker --version

      - name: Publication safety - tracked sensitive/generated state
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|prod|production)$|^supabase/\.(temp|branches)/|\.(pem|p12|pfx|key|jks|keystore)$' || true)"
          if [ -n "$bad" ]; then
            echo "Sensitive/generated paths are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Client platform boundary
        shell: bash
        run: |
          set -euo pipefail
          test -d packages/mobile_app/android
          test -d packages/mobile_app/ios
          test ! -d packages/mobile_app/web
          test -d packages/desktop_app/windows
          test -d packages/desktop_app/linux
          test -d packages/desktop_app/macos
          test ! -d packages/web_app
          test -f packages/mobile_app/README.md
          test -f docs/saas/101_AUDITORIA_FRONTERA_PLATAFORMAS_Y_WEB_FUTURA.md
          echo "Platform contract OK: mobile=Android/iOS, desktop=Windows/Linux/macOS, dedicated Web deferred."

      - name: T02 complete non-stop audit
        run: node scripts/run_saas_t02_ci.mjs

      - name: Edge TypeScript check
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r -d '' file; do
            found=true
            echo "Checking $file"
            deno check "$file"
          done < <(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | sort -z)
          test "$found" = true

      - name: Upload T02 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t02-report
          path: .dart_tool/saas/t02-ci-report.json
          if-no-files-found: warn

  t03-t12-t14-t17-t18-backend:
    name: Automated backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CI candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/saas/CI_CANDIDATE_SOURCE.json
          test -f supabase/migrations/20260822052116_bootstrap_public_schema.sql
          actual_sha="$(sha256sum supabase/migrations/20260822052116_bootstrap_public_schema.sql | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_BOOTSTRAP_CANONICAL_SHA256"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          test "$(command -v pg_dump)" = "/usr/lib/postgresql/17/bin/pg_dump"
          test "$(command -v pg_restore)" = "/usr/lib/postgresql/17/bin/pg_restore"
          psql --version
          pg_dump --version
          pg_restore --version

      - name: T03 start and first clean reset
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
          echo "Supabase local started and reset successfully. Credentials intentionally not printed in public CI logs."

      - name: T04 current database contracts (pgTAP)
        run: node scripts/run_saas_current_pgtap_ci.mjs

      - name: T04 database lint
        run: supabase db lint --local --schema public --level error --fail-on error

      - name: T03/T04 no schema drift
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db diff --local --schema public 2>&1)"
          printf '%s\n' "$output"
          if ! grep -q "No schema changes found" <<<"$output"; then
            echo "Schema drift detectado entre migraciones y DB local."
            exit 1
          fi

      - name: T05-T09/T12/T14 representative multi-tenant E2E
        run: node scripts/run_saas_e2e_ci.mjs

      - name: T12 tenant exports ORG_A and ORG_B
        shell: bash
        run: |
          set -euo pipefail
          ORG_A_ID="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.dart_tool/saas/f9_1_e2e_report.json','utf8'));process.stdout.write(r.organizations.ORG_A)")"
          ORG_B_ID="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.dart_tool/saas/f9_1_e2e_report.json','utf8'));process.stdout.write(r.organizations.ORG_B)")"
          node scripts/saas_export_tenant.mjs --organization-id "$ORG_A_ID"
          node scripts/saas_export_tenant.mjs --organization-id "$ORG_B_ID"

      - name: T17 concurrency probe
        env:
          STOMNI_LOAD_CONCURRENCY: '8'
          STOMNI_LOAD_CUSTOMERS_PER_TENANT: '40'
          STOMNI_LOAD_INVENTORY_WRITES_PER_TENANT: '20'
          STOMNI_LOAD_READS_PER_TENANT: '40'
        run: node supabase/tests/performance/multi_tenant_concurrency_probe.mjs

      - name: T18 backup
        env:
          STOMNI_SAAS_BACKUP_DIR: .dart_tool/saas/backups/ci
        run: node scripts/saas_backup_local.mjs

      - name: T18 destructive restore drill (local runner only)
        env:
          STOMNI_ALLOW_DESTRUCTIVE_RESTORE: 'YES'
          STOMNI_SAAS_BACKUP_DIR: .dart_tool/saas/backups/ci
        run: node scripts/saas_restore_drill_local.mjs .dart_tool/saas/backups/ci

      - name: T03/T18 reproducibility second reset
        run: supabase db reset

      - name: Re-run current pgTAP after second reset
        run: node scripts/run_saas_current_pgtap_ci.mjs

      - name: Re-check no schema drift after second reset
        shell: bash
        run: |
          set -euo pipefail
          output="$(supabase db diff --local --schema public 2>&1)"
          printf '%s\n' "$output"
          if ! grep -q "No schema changes found" <<<"$output"; then
            echo "Schema drift detectado después del segundo reset."
            exit 1
          fi

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-saas-evidence
          path: |
            .dart_tool/saas/**/*.json
            .dart_tool/saas/backups/ci/manifest.json
          if-no-files-found: warn

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  t01-t13-t15-mobile-android:
    name: Flutter core/mobile + Android
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: T01 dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          (cd packages/core_logic && flutter pub get)
          (cd packages/mobile_app && flutter pub get)
          (cd packages/desktop_app && flutter pub get)
          git diff --exit-code

      - name: T13 format check
        shell: bash
        run: |
          set -euo pipefail
          dart format packages/core_logic/lib/utils/stock_utils.dart
          git diff -- packages/core_logic/lib/utils/stock_utils.dart
          exit 1

      - name: T13 analyze core
        working-directory: packages/core_logic
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: T13 test core
        working-directory: packages/core_logic
        run: flutter test --reporter expanded

      - name: T13 analyze mobile
        working-directory: packages/mobile_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: T13 test mobile
        working-directory: packages/mobile_app
        run: flutter test --reporter expanded

      - name: T15 build Android debug APK
        working-directory: packages/mobile_app
        run: flutter build apk --debug --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=SUPABASE_ANON_KEY=ci-local-placeholder

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-build
          path: packages/mobile_app/build/app/outputs/flutter-apk/app-debug.apk

  t13-t15-windows:
    name: Windows desktop validation
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve desktop dependencies
        working-directory: packages/desktop_app
        run: flutter pub get

      - name: Analyze desktop
        working-directory: packages/desktop_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test desktop
        working-directory: packages/desktop_app
        run: flutter test --reporter expanded

      - name: Build Windows release
        working-directory: packages/desktop_app
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: packages/desktop_app/build/windows/x64/runner/Release/**

  t15-linux:
    name: Linux desktop compile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Install Linux desktop toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve desktop dependencies
        working-directory: packages/desktop_app
        run: flutter pub get

      - name: Linux desktop test
        working-directory: packages/desktop_app
        run: flutter test --reporter expanded

      - name: Build Linux release
        working-directory: packages/desktop_app
        run: flutter build linux --release

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: packages/desktop_app/build/linux/x64/release/bundle/**

  macos-ios-smoke:
    name: macOS/iOS compile smoke
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          flutter doctor -v
          xcodebuild -version
          pod --version

      - name: macOS desktop dependencies
        working-directory: packages/desktop_app
        run: flutter pub get

      - name: macOS desktop test
        working-directory: packages/desktop_app
        run: flutter test --reporter expanded

      - name: Build macOS release
        working-directory: packages/desktop_app
        run: flutter build macos --release

      - name: iOS dependencies
        working-directory: packages/mobile_app
        run: flutter pub get

      - name: iOS simulator compile smoke
        working-directory: packages/mobile_app
        run: flutter build ios --simulator --debug --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=SUPABASE_ANON_KEY=ci-local-placeholder

  validation-summary:
    name: CI candidate summary
    if: always()
    needs:
      - t00-t02-static
      - t03-t12-t14-t17-t18-backend
      - t01-t13-t15-mobile-android
      - t13-t15-windows
      - t15-linux
      - macos-ios-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Summarize jobs
        shell: bash
        run: |
          echo "T00-T02 static: ${{ needs.t00-t02-static.result }}"
          echo "Backend automated: ${{ needs.t03-t12-t14-t17-t18-backend.result }}"
          echo "Flutter mobile/Android: ${{ needs.t01-t13-t15-mobile-android.result }}"
          echo "Windows: ${{ needs.t13-t15-windows.result }}"
          echo "Linux: ${{ needs.t15-linux.result }}"
          echo "macOS/iOS: ${{ needs.macos-ios-smoke.result }}"
          {
            echo "## StOmni SaaS CI candidate"
            echo ""
            echo "- Static: ${{ needs.t00-t02-static.result }}"
            echo "- Backend automated: ${{ needs.t03-t12-t14-t17-t18-backend.result }}"
            echo "- Mobile/Android: ${{ needs.t01-t13-t15-mobile-android.result }}"
            echo "- Windows: ${{ needs.t13-t15-windows.result }}"
            echo "- Linux: ${{ needs.t15-linux.result }}"
            echo "- macOS/iOS: ${{ needs.macos-ios-smoke.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.t00-t02-static.result }}" != "success" ] || \
             [ "${{ needs.t03-t12-t14-t17-t18-backend.result }}" != "success" ] || \
             [ "${{ needs.t01-t13-t15-mobile-android.result }}" != "success" ] || \
             [ "${{ needs.t13-t15-windows.result }}" != "success" ] || \
             [ "${{ needs.t15-linux.result }}" != "success" ] || \
             [ "${{ needs.macos-ios-smoke.result }}" != "success" ]; then
            echo "CI CANDIDATE NOT GREEN"
            exit 1
          fi
          echo "CI CANDIDATE GREEN"
          echo "Local acceptance L00-L08 and T19 are still required. This workflow never deploys or merges."
